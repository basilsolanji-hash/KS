name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Новая отправка отменяет незаконченную сборку той же ветки: проверяется только последняя версия.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Постоянный ключ подписи из секретов репозитория (KS_KEYSTORE_BASE64, KS_KEYSTORE_PASSWORD):
      # с ним новые версии ставятся поверх старых. Без секретов — одноразовый отладочный ключ.
      - name: Signing key
        env:
          KS_KEYSTORE_BASE64: ${{ secrets.KS_KEYSTORE_BASE64 }}
          KS_KEYSTORE_PASSWORD: ${{ secrets.KS_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_KEYSTORE_BASE64" ] && [ -n "$KS_KEYSTORE_PASSWORD" ]; then
            echo "$KS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ks.jks"
            echo "KS_KEYSTORE_FILE=$RUNNER_TEMP/ks.jks" >> "$GITHUB_ENV"
            echo "Подпись: постоянный ключ из секретов"
          else
            echo "::warning::Секреты KS_KEYSTORE_BASE64 / KS_KEYSTORE_PASSWORD не заданы — APK подписан одноразовым ключом и не обновит прежнюю версию"
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon test

      - name: Google Sheets script tests
        run: node google-sheets/test/run.js

      - name: Android lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Build APK (+ UI tests APK)
        env:
          KS_KEYSTORE_PASSWORD: ${{ secrets.KS_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease assembleDebugAndroidTest

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/KnitCalculator-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/KnitCalculator-release.apk
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: KnitCalculator-apk
          path: dist/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            core/build/reports/
          if-no-files-found: ignore

      - name: Publish APK to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Фабрика "KS" — сборка ${{ github.run_number }}
          body: |
            Устанавливайте KnitCalculator-release.apk.
            Подпись — постоянным ключом фабрики (если заданы секреты репозитория), новые версии ставятся поверх.
          prerelease: true
          files: dist/*.apk

  ui-tests:
    # Проверка на эмуляторе Android: сценарии калькулятора, расхода пряжи, КП и PDF + скриншоты.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and test APKs
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Run UI tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r com.knit.calculator.test/androidx.test.runner.AndroidJUnitRunner | tee ui-tests.txt
            mkdir -p screenshots && (adb exec-out run-as com.knit.calculator tar cf - files/screenshots > screenshots.tar; tar xf screenshots.tar -C screenshots) || true

      - name: Check results
        run: |
          grep -E "INSTRUMENTATION_CODE|OK \(|FAILURES|Tests run" ui-tests.txt || true
          if grep -q "FAILURES!!!" ui-tests.txt || ! grep -q "OK (" ui-tests.txt; then
            grep -B2 -A25 "INSTRUMENTATION_STATUS: stack" ui-tests.txt | head -150 || true
            exit 1
          fi

      - name: Pack screenshots
        if: always()
        run: |
          cp ui-tests.txt screenshots/ 2>/dev/null || true
          cd screenshots && zip -r ../ui-screenshots.zip . || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ui-screenshots.zip
          if-no-files-found: ignore

      - name: Attach screenshots to release
        if: always() && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: ui-screenshots.zip

  # Сервер staff.fabrika-ks.ru: тесты (SQLite и MySQL, как на beget) и выкладка по FTP, если заданы секреты.
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: ks_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -ptest" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Server tests (SQLite)
        run: php server/tests/run.php

      - name: Server tests (MySQL)
        env:
          DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=ks_test;charset=utf8mb4
          DB_USER: root
          DB_PASSWORD: test
        run: |
          # Служба MySQL после проверки здоровья иногда ещё перезапускается — ждём, пока примет подключение.
          for i in $(seq 1 30); do php -r 'new PDO(getenv("DB_DSN"), getenv("DB_USER"), getenv("DB_PASSWORD"));' 2>/dev/null && break; sleep 2; done
          php server/tests/run.php

      # Пароли — только из секретов GitHub; config.php собирается здесь и уходит на сервер выше папки сайта.
      - name: Deploy to beget
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          FTP_HOST: ${{ secrets.BEGET_FTP_HOST }}
          FTP_USER: ${{ secrets.BEGET_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.BEGET_FTP_PASSWORD }}
          SITE_DIR: ${{ secrets.BEGET_SITE_DIR }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          KS_APP_KEY: ${{ secrets.KS_APP_KEY }}
          KS_SETUP_KEY: ${{ secrets.KS_SETUP_KEY }}
          MS_TOKEN: ${{ secrets.MS_TOKEN }}
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$DB_NAME" ] || [ -z "$KS_SETUP_KEY" ]; then
            echo "Секреты beget не заданы — выкладка пропущена"; exit 0
          fi
          sudo apt-get install -y -qq lftp > /dev/null
          # Сверка ключа установки без раскрытия: длина и начало хэша (sha256).
          echo "KS_SETUP_KEY: длина $(printf '%s' "$KS_SETUP_KEY" | wc -c), sha256 $(printf '%s' "$KS_SETUP_KEY" | tr -d '[:space:]' | sha256sum | cut -c1-12)"
          SITE_DIR="${SITE_DIR:-.}"
          mkdir -p deploy/ks/src deploy/public_html
          cp server/src/*.php deploy/ks/src/
          cp server/public/index.php server/public/.htaccess deploy/public_html/
          php -r 'file_put_contents("deploy/ks/config.php", "<?php\nreturn " . var_export([
            "db_host" => getenv("DB_HOST") ?: "localhost", "db_name" => getenv("DB_NAME"), "db_user" => getenv("DB_USER"),
            "db_password" => getenv("DB_PASSWORD"), "app_key" => getenv("KS_APP_KEY"), "setup_key" => getenv("KS_SETUP_KEY"),
            "ms_token" => getenv("MS_TOKEN"),
          ], true) . ";\n");'
          printf 'Require all denied\n' > deploy/ks/.htaccess
          lftp -u "$FTP_USER,$FTP_PASSWORD" "$FTP_HOST" -e "
            set ftp:ssl-allow yes; set net:max-retries 2; set net:timeout 20;
            mkdir -p $SITE_DIR/ks; mirror -R --no-perms deploy/ks $SITE_DIR/ks;
            mirror -R --no-perms deploy/public_html $SITE_DIR/public_html;
            rm -f $SITE_DIR/public_html/index.html; echo '--- папка сайта:'; cls -la $SITE_DIR; echo '--- public_html:'; cls -la $SITE_DIR/public_html; bye"
          rm -rf deploy
          # Проверка: сайт отвечает, база подключается (запрос без входа должен дойти до проверки ключа).
          URL="${KS_URL:-https://staff.fabrika-ks.ru/}"
          curl -sS -I --max-time 20 "$URL" | head -15
          echo "GET:  $(curl -sS --max-time 20 "$URL" | head -c 300)"
          R=$(curl -sS --max-time 20 -X POST -H 'Content-Type: application/json' -d '{"action":"me"}' "$URL")
          echo "POST: $(echo "$R" | head -c 300)"
          echo "$R" | grep -q '"ok"' || { echo "::error::Сервер не ответил JSON — проверьте папку сайта и версию PHP"; exit 1; }
          echo "$R" | grep -q 'Сервер недоступен' && { echo "::error::Нет подключения к базе — проверьте DB_* секреты"; exit 1; }
          echo "Сервер выложен: $URL"
